services:
  - type: web
    name: finance-ledger
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: finance-ledger-db
          property: connectionString
databases:
  - name: finance-ledger-db
    databaseName: finance_ledger
    user: finance_user
