{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">TEAM ACCESS</div><h1>用户管理</h1><p>管理员可为团队成员创建登录账号。</p></div></div><div class="two-cols"><section class="table-card"><div class="table-title"><h2>现有用户</h2></div><table><thead><tr><th>用户名</th><th>角色</th><th>创建时间</th><th></th></tr></thead><tbody>{% for u in users %}<tr><td><b>{{ u.username }}</b></td><td>{% if u.is_admin %}<span class="tag">管理员</span>{% else %}普通成员{% endif %}</td><td>{{ u.created_at.strftime('%Y-%m-%d') }}</td><td>{% if u.id != current_user.id %}<form class="inline" method="post" action="{{ url_for('user_toggle', user_id=u.id) }}"><button class="text-link">{{ '取消管理员' if u.is_admin else '设为管理员' }}</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table></section><section class="table-card add-user"><h2>添加用户</h2><form method="post"><label>用户名<input name="username" required></label><label>初始密码<input name="password" type="password" minlength="8" required></label><label class="checkbox"><input type="checkbox" name="is_admin"> 设为管理员</label><button>创建账号</button></form></section></div>{% endblock %}
