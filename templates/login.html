{% extends 'base.html' %}{% block title %}登录 · 财务台账{% endblock %}{% block content %}
<section class="login-card"><img class="login-logo" src="{{ url_for('static', filename='stevenleach-logo.jpg') }}" alt="StevenLeach"><div class="eyebrow">PROJECT FINANCE</div><h1>欢迎回来</h1><p>登录以访问团队财务台账。</p><form method="post" id="login-form"><label>用户名<input name="username" required autofocus></label><label>密码<input name="password" type="password" required></label><button id="login-button">登录</button></form><div class="login-loading" id="login-loading"><i></i><span>正在进入财务台账…</span></div></section><script>document.getElementById('login-form').addEventListener('submit',function(){document.getElementById('login-loading').classList.add('show');document.getElementById('login-button').disabled=true;document.getElementById('login-button').textContent='登录中…'})</script>
{% endblock %}
