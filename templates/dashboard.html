{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">PROJECT LEDGER</div><h1>按年份查看财务台账</h1><p>选择年度，查看项目与每笔款项。</p></div><a class="button" href="{{ url_for('project_new') }}">+ 新增项目</a></div><section class="stats years">{% for x in years %}<a class="year-card" href="{{ url_for('year_detail',year=x.year) }}"><span>{{ x.year }} 年</span><strong>{{ x.count }} 个项目</strong><small>预计毛利 {{ x.totals.profit|currency }}</small><b>查看项目 →</b></a>{% else %}<article>尚无项目。</article>{% endfor %}</section>{% endblock %}
