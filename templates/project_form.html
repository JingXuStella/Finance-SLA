{% extends 'base.html' %}{% block title %}{{ '编辑' if project else '新增' }}项目 · 财务台账{% endblock %}{% block content %}
<div class="form-page"><a class="back" href="{{ url_for('dashboard') }}">← 返回台账</a><h1>{{ '编辑项目' if project else '新增项目' }}</h1><p>毛利将自动按“主合同 − 分包支出 − 其他成本”计算。</p><form class="project-form" method="post"><div class="grid"><label>年度<input name="year" type="number" min="2000" max="2100" required value="{{ project.year if project else now_year }}"></label><label>项目名称<input name="name" required value="{{ project.name if project else '' }}"></label><label>客户名称<input name="client" value="{{ project.client if project else '' }}"></label><label>项目负责人<input name="manager" value="{{ project.manager if project else '' }}"></label><label>主合同金额（元）<input name="contract_amount" type="number" step="0.01" min="0" required value="{{ project.contract_amount if project else 0 }}"></label><label>分包支出（元）<input name="subcontract_amount" type="number" step="0.01" min="0" required value="{{ project.subcontract_amount if project else 0 }}"></label><label>其他成本（元）<input name="other_cost" type="number" step="0.01" min="0" required value="{{ project.other_cost if project else 0 }}"></label><label>已开票金额（元）<input name="invoice_amount" type="number" step="0.01" min="0" required value="{{ project.invoice_amount if project else 0 }}"></label><label>发票状态<select name="invoice_status">{% for status in ['未开票','部分开票','已开票','已收款'] %}<option {% if project and project.invoice_status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label></div><label>备注<textarea name="notes" rows="4" placeholder="可记录合同编号、预计回款、风险说明等">{{ project.notes if project else '' }}</textarea></label><div class="actions"><a href="{{ url_for('dashboard') }}">取消</a><button>保存项目</button></div></form></div>
{% endblock %}
