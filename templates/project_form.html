{% extends 'base.html' %}{% block content %}<div class="form-page"><a class="back" href="{{ url_for('dashboard') }}">← 返回年份</a><h1>{{ '编辑项目' if project else '新增项目' }}</h1><p>创建项目后可逐笔管理款项。</p><form class="project-form" method="post"><div class="grid"><label>年度<input name="year" type="number" required value="{{ project.year if project else now_year }}"></label><label>项目名称<input name="name" required value="{{ project.name if project else '' }}"></label><label>客户名称<input name="client" value="{{ project.client if project else '' }}"></label><label>项目负责人<input name="manager" value="{{ project.manager if project else '' }}"></label></div><label>备注<textarea name="notes">{{ project.notes if project else '' }}</textarea></label><div class="actions"><a href="{{ url_for('dashboard') }}">取消</a><button>保存项目</button></div></form></div>{% endblock %}
